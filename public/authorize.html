<!DOCTYPE html>
<html>
	<head>
		<meta charset=utf-8>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>{{APP_NAME}} sign in</title>
		<link rel="stylesheet" href="/style.css">
		<style>
			.admin-section {
				margin-bottom: 1.5rem;
			}

			.admin-label {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 0.9rem;
				font-weight: bold;
				cursor: pointer;
				color: #333;
			}

			.admin-hint {
				font-size: 0.75rem;
				color: #777;
				margin-top: 0.25rem;
				margin-left: 21px;
				line-height: 1.4;
			}

			button[type=submit] {
				margin-bottom: 0.75rem;
			}
		</style>
	</head>
	<body class=column>
		<div class="view column">
			<h1>{{APP_NAME}}</h1>
			<p class="subtitle" id="page-subtitle">Generate bearer token</p>
			<form id="consent-form" method="POST" action="/oauth/authorize/consent">
				<div id="hidden-inputs"></div>
				<div class="form-group" id="session-name-group">
					<label for="session_name">Session Name (optional)</label>
					<input type="text" name="session_name" id="session_name" placeholder="e.g. Coding Agent, Chef Assistant">
				</div>
				<div class="admin-section" id="admin-group">
					<label class="admin-label">
						<input type="checkbox" name="admin" id="admin" value="true">
						<span>Allow session administration (admin tool)</span>
					</label>
					<div class="admin-hint">Grant permission to manage sessions, connect upstream apps, and configure routing policies. Leave unchecked for restricted or untrusted agents.</div>
				</div>
				<div class="form-group" id="token-group" style="display: none;">
					<label for="token">Admin Bearer Token</label>
					<input type="password" name="token" id="token" placeholder="Paste existing admin token" disabled>
				</div>
				<div id="provider-buttons"></div>
			</form>
		</div>
		<script>
			const initData = {{INIT_DATA}}

			function init () {
				const params = initData.params || {}
				const clientName = initData.clientName || null
				const providers = Array.isArray(initData.providers) ? initData.providers : []
				const localAuth = Boolean(initData.localAuth)
				const linkMode = Boolean(initData.linkMode)
				const nameEl = document.getElementById('session_name')
				if (params.session_name && nameEl) {
					nameEl.value = params.session_name
				} else if (clientName && nameEl) {
					nameEl.value = clientName
				}
				const subEl = document.getElementById('page-subtitle')
				if (linkMode) {
					const nameGroup = document.getElementById('session-name-group')
					const adminGroup = document.getElementById('admin-group')
					if (nameGroup) nameGroup.style.display = 'none'
					if (adminGroup) adminGroup.style.display = 'none'
					if (subEl) {
						const prefix = initData.mergeMode ? 'Merge sign-in with ' : 'Link sign-in to '
						subEl.textContent = initData.linkAccount ? (prefix + initData.linkAccount) : 'Link sign-in provider'
					}
				} else if (clientName && subEl) {
					subEl.textContent = 'Authorize ' + clientName
				}
				const btnContainer = document.getElementById('provider-buttons')
				const filteredProviders = params.provider
					? providers.filter(p => p.id === String(params.provider).toLowerCase())
					: providers
				const listToRender = linkMode ? filteredProviders : (filteredProviders.length > 0 ? filteredProviders : providers)
				for (const p of listToRender) {
					const btn = document.createElement('button')
					btn.type = 'submit'
					btn.name = 'provider'
					btn.value = p.id
					btn.textContent = 'Sign in with ' + p.name
					btnContainer.appendChild(btn)
				}
				if (localAuth) {
					const tokenGroup = document.getElementById('token-group')
					const tokenInput = document.getElementById('token')
					if (tokenGroup) tokenGroup.style.display = 'block'
					if (tokenInput) {
						tokenInput.disabled = false
						if (listToRender.length === 0) tokenInput.required = true
					}
					const btn = document.createElement('button')
					btn.type = 'submit'
					btn.id = 'submit-btn'
					btn.textContent = 'Sign in with Token'
					btnContainer.appendChild(btn)
				}
				const hiddenContainer = document.getElementById('hidden-inputs')
				for (const [key, value] of Object.entries(params)) {
					if (key === 'provider' || key === 'token' || key === 'admin' || key === 'session_name') continue
					const input = document.createElement('input')
					input.type = 'hidden'
					input.name = key
					input.value = value
					hiddenContainer.appendChild(input)
				}
			}

			init()
		</script>
	</body>
</html>
