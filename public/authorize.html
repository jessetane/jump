<!DOCTYPE html>
<html>
	<head>
		<meta charset=utf-8>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>jump sign in</title>
		<style>
			* {
				box-sizing: border-box;
			}

			html {
				height: 100%;
			}

			body {
				margin: 0;
				height: 100%;
				font-family: sans-serif;
			}

			.column {
				display: flex;
				flex-direction: column;
			}

			.view {
				margin: auto;
				width: 100%;
				padding: 24px;
			}

			@media (min-width: 520px) {
				.view {
					max-width: 440px;
				}
			}

			h1 {
				font-size: 1.5rem;
				text-align: center;
				margin-top: 0.85rem;
				margin-bottom: 0.5rem;
			}

			.subtitle {
				color: #555;
				font-size: 0.95rem;
				line-height: 1.4;
				text-align: center;
				margin: 0 0 1.5rem;
			}

			.form-group {
				margin-bottom: 1.25rem;
			}

			.form-group label {
				display: block;
				font-size: 0.9rem;
				font-weight: bold;
				margin-bottom: 0.35rem;
				color: #333;
			}

			.form-group input[type=email],
			.form-group input[type=text] {
				width: 100%;
				padding: 10px 12px;
				font-size: 0.95rem;
				border: 1px solid #ccc;
				border-radius: 6px;
			}

			.admin-section {
				margin-bottom: 1.5rem;
				padding: 12px;
				background: #f8fafc;
				border: 1px solid #e2e8f0;
				border-radius: 6px;
			}

			.admin-label {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 0.9rem;
				font-weight: bold;
				cursor: pointer;
				color: #1e293b;
			}

			.admin-hint {
				font-size: 0.78rem;
				color: #64748b;
				margin-top: 0.35rem;
				margin-left: 21px;
				line-height: 1.35;
			}

			button[type=submit] {
				width: 100%;
				padding: 12px 16px;
				background: #000;
				color: #fff;
				border: none;
				border-radius: 6px;
				font-size: 1rem;
				cursor: pointer;
				font-weight: 500;
			}

			button[type=submit]:hover {
				opacity: 0.85;
			}
		</style>
	</head>
	<body class=column>
		<div class="view column">
			<h1 id="page-title">Generate Bearer Token</h1>
			<p class="subtitle" id="page-subtitle">Enter your email to receive a sign-in magic link and create an MCP session token</p>
			<form id="consent-form" method="POST" action="/oauth/authorize/consent">
				<div id="hidden-inputs"></div>
				<div class="form-group" id="email-group">
					<label for="email">Email Address</label>
					<input type="email" name="email" id="email" required placeholder="you@example.com">
				</div>
				<div class="form-group" id="session-name-group">
					<label for="session_name">Session Name (optional)</label>
					<input type="text" name="session_name" id="session_name" placeholder="e.g. Coding Agent, Chef Assistant">
				</div>
				<div class="admin-section" id="admin-group">
					<label class="admin-label">
						<input type="checkbox" name="admin" id="admin" value="true">
						<span>Admin Privileges</span>
					</label>
					<div class="admin-hint">Allows managing other sessions and connecting upstream apps via the <code>admin</code> tool.</div>
				</div>
				<button type="submit" id="submit-btn">Send Magic Link</button>
			</form>
		</div>
		<script>
			const initData = {{INIT_DATA}}

			function init () {
				const params = initData.params || {}
				if (params.email) {
					const emailEl = document.getElementById('email')
					if (emailEl) emailEl.value = params.email
				}
				if (params.session_name) {
					const nameEl = document.getElementById('session_name')
					if (nameEl) nameEl.value = params.session_name
				}
				if (params.admin !== undefined) {
					const adminEl = document.getElementById('admin')
					if (adminEl) adminEl.checked = params.admin === 'true' || params.admin === '1' || params.admin === 'on'
				}
				const hiddenContainer = document.getElementById('hidden-inputs')
				for (const [key, value] of Object.entries(params)) {
					if (key === 'email' || key === 'admin' || key === 'session_name') continue
					const input = document.createElement('input')
					input.type = 'hidden'
					input.name = key
					input.value = value
					hiddenContainer.appendChild(input)
				}
			}

			init()
		</script>
	</body>
</html>
