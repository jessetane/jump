<!DOCTYPE html>
<html>
	<head>
		<meta charset=utf-8>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>{{APP_NAME}} connect</title>
		<link rel="stylesheet" href="/style.css">
		<style>
			.subtitle,
			#app-name-group,
			#auth-url-warning,
			#submit-btn {
				width: 100%;
				max-width: 432px;
				margin-left: auto;
				margin-right: auto;
			}

			#auth-url-warning {
				display: none;
				margin-bottom: 1rem;
				padding: 10px 12px;
				border: 1px solid #d97706;
				border-radius: 6px;
				background: #fffbeb;
				color: #92400e;
				font-size: 0.85rem;
				line-height: 1.4;
			}

			.subtitle {
				margin-bottom: 0.75rem;
			}

			.table-wrap {
				width: 100%;
				overflow-x: auto;
				margin-bottom: 1rem;
			}

			.table {
				width: 100%;
				border-collapse: collapse;
				font-size: 0.9rem;
			}

			.table thead {
				display: none;
			}

			.table th {
				text-align: center;
				padding: 8px 6px;
				border-bottom: 2px solid #ccc;
				white-space: nowrap;
			}

			.table th:first-child {
				text-align: left;
			}

			.table tbody tr {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 6px 14px;
				padding: 8px 6px;
				border-bottom: 1px solid #eee;
			}

			.table tbody tr:hover {
				background: #fafafa;
			}

			.table tbody td {
				padding: 0;
				border-bottom: none;
			}

			.table tbody td:first-child {
				flex: 1 0 100%;
			}

			.table tbody td.col-check:empty {
				display: none;
			}

			.mode-option {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				cursor: pointer;
			}

			.mode-option:has(input:disabled) {
				cursor: default;
			}

			.mode-label {
				font-size: 0.85rem;
				color: #444;
			}

			@media (min-width: 600px) {
				.view.has-table {
					width: fit-content;
					min-width: 480px;
					max-width: 94vw;
				}

				.table thead {
					display: table-header-group;
				}

				.table tbody tr {
					display: table-row;
					padding: 0;
					border-bottom: none;
				}

				.table tbody td {
					padding: 8px 6px;
					border-bottom: 1px solid #eee;
				}

				.table tbody td.col-check {
					text-align: center;
					width: 68px;
				}

				.table tbody td.col-check:empty {
					display: table-cell;
				}

				.mode-option {
					justify-content: center;
				}

				.mode-label {
					display: none;
				}
			}
		</style>
	</head>
	<body class=column>
		<div class="view column" id="connect-view">
			<h1>{{APP_NAME}}</h1>
			<p class="subtitle" id="page-subtitle">Configure API services access</p>
			<form id="connect-form" method="POST" action="/providers/google/consent" class="column">
				<div id="hidden-inputs"></div>
				<div class="form-group" id="app-name-group">
					<label for="app-name">App Name (optional)</label>
					<input type="text" id="app-name" name="app_name" placeholder="e.g. Personal Account, Work Account">
				</div>
				<div class="table-wrap" id="services-wrap">
					<table class="table" id="services-table">
						<thead>
							<tr id="header-row">
								<th>Service</th>
							</tr>
						</thead>
						<tbody id="service-rows">
							<tr id="row-all">
								<td><strong>All</strong></td>
							</tr>
						</tbody>
					</table>
				</div>
				<div id="auth-url-warning" role="alert"></div>
				<button type="submit" id="submit-btn">Authorize with Google</button>
			</form>
		</div>
		<script type="module">
			import { measureAuthUrlLength, findSubsumedTokens } from '/oauth-scopes.js'
			const initData = {{INIT_DATA}}

			function formatModeLabel (mode) {
				return mode ? mode.charAt(0).toUpperCase() + mode.slice(1) : ''
			}

			function collectModes (services) {
				const modes = []
				const seen = new Set()
				for (const s of services) {
					for (const mode of (Array.isArray(s.modes) ? s.modes : [])) {
						if (!seen.has(mode)) {
							seen.add(mode)
							modes.push(mode)
						}
					}
				}
				return modes
			}

			function updateAuthUrlWarning (warningConfig, scopeByToken, warningEl, providerName, impliedScopes) {
				if (!warningConfig || !warningEl) return
				const scopeSet = new Set(warningConfig.baseScopes || [])
				for (const box of document.querySelectorAll('input[name="services"]')) {
					if (!box.checked) continue
					for (const s of (scopeByToken.get(box.value) || [])) scopeSet.add(s)
				}
				const len = measureAuthUrlLength(warningConfig.templateUrl, scopeSet, impliedScopes)
				const over = len > warningConfig.maxLength
				warningEl.style.display = over ? 'block' : 'none'
				warningEl.textContent = over
					? 'Heads up: long URLs (' + len + ' chars) may cause ' + providerName + ' authorization to hang or fail. If it stalls, try selecting fewer services or connecting separate apps per workflow.'
					: ''
			}

			function syncServiceState (services, userSelectedTokens, impliedScopes, allModes, onUpdate) {
				const subsumed = findSubsumedTokens(services, userSelectedTokens, impliedScopes)
				const allBoxes = document.querySelectorAll('input[name="services"]')
				for (const box of allBoxes) {
					const isSubsumed = subsumed.has(box.value)
					box.disabled = isSubsumed
					box.checked = isSubsumed || userSelectedTokens.has(box.value)
					box.title = isSubsumed ? 'Included by another selected scope' : ''
				}
				for (const mode of allModes) {
					const allBox = document.getElementById('all_' + mode)
					if (!allBox) continue
					let total = 0
					let checked = 0
					let enabled = 0
					for (const box of allBoxes) {
						if (box.dataset.mode !== mode) continue
						total++
						if (box.checked) checked++
						if (!box.disabled) enabled++
					}
					allBox.disabled = total === 0 || enabled === 0
					allBox.checked = total > 0 && checked === total
					allBox.indeterminate = checked > 0 && checked < total
				}
				if (onUpdate) onUpdate()
			}

			function createModeCell (labelText, inputEl) {
				const td = document.createElement('td')
				td.className = 'col-check'
				const label = document.createElement('label')
				label.className = 'mode-option'
				const span = document.createElement('span')
				span.className = 'mode-label'
				span.textContent = labelText
				label.appendChild(inputEl)
				label.appendChild(span)
				td.appendChild(label)
				return td
			}

			function init () {
				const params = initData.params || {}
				const provider = initData.provider || { id: 'google', name: 'Google' }
				const services = Array.isArray(initData.services) ? initData.services : []
				const impliedScopes = initData.impliedScopes || null
				const allModes = collectModes(services)
				const viewEl = document.getElementById('connect-view')
				const formEl = document.getElementById('connect-form')
				const subtitleEl = document.getElementById('page-subtitle')
				const submitEl = document.getElementById('submit-btn')
				const warningEl = document.getElementById('auth-url-warning')
				const wrapEl = document.getElementById('services-wrap')
				const warningConfig = initData.authUrlWarning || null
				const scopeByToken = new Map()
				for (const s of services) {
					if (!s.scopes) continue
					for (const [mode, list] of Object.entries(s.scopes)) {
						scopeByToken.set(s.id + ':' + mode, list)
					}
				}
				const syncWarning = () => updateAuthUrlWarning(warningConfig, scopeByToken, warningEl, provider.name, impliedScopes)
				if (formEl) formEl.action = '/providers/' + provider.id + '/consent'
				if (submitEl) submitEl.textContent = 'Authorize with ' + provider.name
				if (params.reauth_app_id) {
					const nameGroup = document.getElementById('app-name-group')
					if (subtitleEl) subtitleEl.textContent = 'Renew ' + provider.name + ' credentials'
					if (nameGroup) nameGroup.style.display = 'none'
				} else {
					if (subtitleEl) {
						subtitleEl.textContent = services.length > 0
							? 'Configure API services access'
							: 'Connect ' + provider.name + ' account'
					}
					if (params.app_name || params.name) {
						const nameInput = document.getElementById('app-name')
						if (nameInput) nameInput.value = params.app_name || params.name
					}
				}
				const userSelectedTokens = new Set()
				if (params.services) {
					for (const part of String(params.services).split(',')) {
						const token = part.trim().toLowerCase()
						if (token) userSelectedTokens.add(token)
					}
				}
				const syncAll = () => syncServiceState(services, userSelectedTokens, impliedScopes, allModes, syncWarning)
				if (services.length > 0 && allModes.length > 0) {
					if (viewEl) viewEl.classList.add('has-table')
					const headerRow = document.getElementById('header-row')
					const allRow = document.getElementById('row-all')
					for (const mode of allModes) {
						const labelText = formatModeLabel(mode)
						const th = document.createElement('th')
						th.textContent = labelText
						headerRow.appendChild(th)
						const allBox = document.createElement('input')
						allBox.type = 'checkbox'
						allBox.id = 'all_' + mode
						allBox.setAttribute('aria-label', 'All ' + labelText)
						allBox.addEventListener('change', function () {
							const checked = allBox.checked
							for (const box of document.querySelectorAll('input[name="services"]')) {
								if (box.dataset.mode !== mode) continue
								if (checked) userSelectedTokens.add(box.value)
								else userSelectedTokens.delete(box.value)
							}
							syncAll()
						})
						allRow.appendChild(createModeCell(labelText, allBox))
					}
					const tbody = document.getElementById('service-rows')
					for (const s of services) {
						const svcModes = new Set(Array.isArray(s.modes) ? s.modes : [])
						const tr = document.createElement('tr')
						const tdSvc = document.createElement('td')
						const spanName = document.createElement('span')
						spanName.textContent = s.name
						tdSvc.appendChild(spanName)
						tr.appendChild(tdSvc)
						for (const mode of allModes) {
							if (!svcModes.has(mode)) {
								const emptyTd = document.createElement('td')
								emptyTd.className = 'col-check'
								tr.appendChild(emptyTd)
								continue
							}
							const token = s.id + ':' + mode
							const labelText = formatModeLabel(mode)
							const box = document.createElement('input')
							box.type = 'checkbox'
							box.name = 'services'
							box.id = 'svc_' + s.id + '_' + mode
							box.value = token
							box.dataset.mode = mode
							box.setAttribute('aria-label', s.name + ' ' + labelText)
							box.addEventListener('change', function () {
								if (box.checked) userSelectedTokens.add(token)
								else userSelectedTokens.delete(token)
								syncAll()
							})
							tr.appendChild(createModeCell(labelText, box))
						}
						tbody.appendChild(tr)
					}
					syncAll()
				} else if (wrapEl) {
					wrapEl.style.display = 'none'
				}
				const hiddenContainer = document.getElementById('hidden-inputs')
				for (const [key, value] of Object.entries(params)) {
					if (key === 'services' || key === 'app_name' || key === 'name' || key === 'reauth_app_id') continue
					const input = document.createElement('input')
					input.type = 'hidden'
					input.name = key
					input.value = value
					hiddenContainer.appendChild(input)
				}
			}

			init()
		</script>
	</body>
</html>
