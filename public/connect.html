<!DOCTYPE html>
<html>
	<head>
		<meta charset=utf-8>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>jump connect</title>
		<style>
			* {
				box-sizing: border-box;
			}

			html {
				height: 100%;
			}

			body {
				margin: 0;
				height: 100%;
				font-family: sans-serif;
			}

			.column {
				display: flex;
				flex-direction: column;
			}

			.view {
				margin: auto;
				width: 100%;
				padding: 24px;
			}

			@media (min-width: 520px) {
				.view {
					max-width: 480px;
				}
			}

			h1 {
				font-size: 1.5rem;
				text-align: center;
				margin-top: 0.85rem;
				margin-bottom: 0.85rem;
			}

			.subtitle {
				color: #555;
				font-size: 0.95rem;
				line-height: 1.4;
				text-align: center;
				margin: 0 0 0.75rem;
			}

			.table {
				width: 100%;
				border-collapse: collapse;
				margin-bottom: 1rem;
				font-size: 0.9rem;
			}

			.table th {
				text-align: left;
				padding: 8px 6px;
				border-bottom: 2px solid #ccc;
			}

			.table td {
				padding: 8px 6px;
				border-bottom: 1px solid #eee;
			}

			.table tr:hover {
				background: #fafafa;
			}

			.col-check {
				text-align: center;
				width: 60px;
			}

			.col-check input:disabled {
				opacity: 0.35;
				cursor: not-allowed;
			}

			.form-group {
				margin-bottom: 1.25rem;
			}

			.form-group label {
				display: block;
				font-size: 0.9rem;
				font-weight: bold;
				margin-bottom: 0.35rem;
				color: #333;
			}

			.form-group input[type=text] {
				width: 100%;
				padding: 10px 12px;
				font-size: 0.95rem;
				border: 1px solid #ccc;
				border-radius: 6px;
			}

			button[type=submit] {
				width: 100%;
				padding: 11px 16px;
				background: #000;
				color: #fff;
				border: none;
				border-radius: 6px;
				font-size: 1rem;
				cursor: pointer;
				margin-bottom: 1.5rem;
			}

			button[type=submit]:hover {
				opacity: 0.85;
			}
		</style>
	</head>
	<body class=column>
		<div class="view column">
			<h1>jump</h1>
			<p class="subtitle" id="page-subtitle">Configure API services access</p>
			<form id="connect-form" method="POST" action="/providers/google/consent">
				<div id="hidden-inputs"></div>
				<div class="form-group" id="app-name-group">
					<label for="app-name">App Name (optional)</label>
					<input type="text" id="app-name" name="app_name" placeholder="e.g. Personal Account, Work Account">
				</div>
				<table class="table" id="services-table">
					<thead>
						<tr>
							<th>Service</th>
							<th class="col-check">Read</th>
							<th class="col-check">Write</th>
						</tr>
					</thead>
					<tbody id="service-rows">
						<tr id="row-all">
							<td><strong>All</strong></td>
							<td class="col-check"><input type="checkbox" id="all-read"></td>
							<td class="col-check"><input type="checkbox" id="all-write" disabled></td>
						</tr>
					</tbody>
				</table>
				<button type="submit" id="submit-btn">Sign in with Google</button>
			</form>
		</div>
		<script>
			const initData = {{INIT_DATA}}

			function updateAllRowState () {
				const allRead = document.getElementById('all-read')
				const allWrite = document.getElementById('all-write')
				if (!allRead || !allWrite) return
				const services = document.querySelectorAll('input[name="services"]')
				if (services.length === 0) return
				let readTotal = 0
				let readCount = 0
				let writeCount = 0
				for (const s of services) {
					const id = s.value
					const w = document.getElementById('wr_' + id)
					const writeOnly = s.type === 'hidden'
					if (!writeOnly) {
						readTotal++
						if (s.checked) readCount++
					}
					if (w && (writeOnly || s.checked) && w.checked) {
						writeCount++
					}
				}
				let writeTotal = 0
				if (readCount > 0 || writeCount > 0 || readTotal === 0) {
					for (const s of services) {
						const id = s.value
						const w = document.getElementById('wr_' + id)
						const writeOnly = s.type === 'hidden'
						if (w && (writeOnly || s.checked)) {
							writeTotal++
						}
					}
				}
				allRead.checked = readTotal > 0 && readCount === readTotal
				allRead.indeterminate = readCount > 0 && readCount < readTotal
				allWrite.disabled = writeTotal === 0
				if (writeTotal === 0) {
					allWrite.checked = false
					allWrite.indeterminate = false
				} else {
					allWrite.checked = writeCount === writeTotal
					allWrite.indeterminate = writeCount > 0 && writeCount < writeTotal
				}
			}

			function onServiceToggle (id) {
				const s = document.getElementById('svc_' + id)
				const w = document.getElementById('wr_' + id)
				if (!s) return
				if (w) {
					w.disabled = !s.checked
					if (!s.checked) w.checked = false
				}
				updateAllRowState()
			}

			function init () {
				const params = initData.params || {}
				const provider = initData.provider || { id: 'google', name: 'Google' }
				const services = Array.isArray(initData.services) ? initData.services : []
				const formEl = document.getElementById('connect-form')
				const subtitleEl = document.getElementById('page-subtitle')
				const submitEl = document.getElementById('submit-btn')
				const tableEl = document.getElementById('services-table')
				document.title = 'jump connect'
				if (formEl) formEl.action = '/providers/' + provider.id + '/consent'
				if (params.reauth_app_id) {
					const nameGroup = document.getElementById('app-name-group')
					if (subtitleEl) subtitleEl.textContent = 'Renew ' + provider.name + ' credentials'
					if (submitEl) submitEl.textContent = 'Sign in with ' + provider.name
					if (nameGroup) nameGroup.style.display = 'none'
				} else {
					if (subtitleEl) {
						subtitleEl.textContent = services.length > 0
							? 'Configure API services access'
							: 'Connect ' + provider.name + ' account'
					}
					if (submitEl) submitEl.textContent = 'Sign in with ' + provider.name
				}
				if (params.app_name || params.name) {
					const nameInput = document.getElementById('app-name')
					if (nameInput) nameInput.value = params.app_name || params.name
				}
				let serviceIdsRead = null
				if (params.services) {
					serviceIdsRead = new Set()
					for (const part of String(params.services).split(',')) {
						const s = part.trim().toLowerCase()
						if (s) serviceIdsRead.add(s)
					}
				}
				const serviceIdsWrite = new Set()
				if (params.write) {
					for (const part of String(params.write).split(',')) {
						const w = part.trim().toLowerCase()
						if (w) serviceIdsWrite.add(w)
					}
				}
				if (services.length > 0) {
					const tbody = document.getElementById('service-rows')
					for (const s of services) {
						const hasRo = s.ro !== false
						const hasRw = s.rw !== false
						const tr = document.createElement('tr')
						const tdSvc = document.createElement('td')
						const spanName = document.createElement('span')
						spanName.textContent = s.name
						tdSvc.appendChild(spanName)
						const tdRead = document.createElement('td')
						tdRead.className = 'col-check'
						const tdWrite = document.createElement('td')
						tdWrite.className = 'col-check'
						if (!hasRo && hasRw) {
							const isWriteChecked = (serviceIdsRead ? serviceIdsRead.has(s.id) : false) || serviceIdsWrite.has(s.id)
							const inputSvc = document.createElement('input')
							inputSvc.type = 'hidden'
							inputSvc.name = 'services'
							inputSvc.id = 'svc_' + s.id
							inputSvc.value = s.id
							inputSvc.disabled = !isWriteChecked
							tdRead.appendChild(inputSvc)
							const inputWr = document.createElement('input')
							inputWr.type = 'checkbox'
							inputWr.name = 'write'
							inputWr.id = 'wr_' + s.id
							inputWr.value = s.id
							inputWr.checked = isWriteChecked
							inputWr.addEventListener('change', function () {
								inputSvc.disabled = !inputWr.checked
								updateAllRowState()
							})
							tdWrite.appendChild(inputWr)
						} else {
							const isReadChecked = serviceIdsRead ? serviceIdsRead.has(s.id) : false
							const inputSvc = document.createElement('input')
							inputSvc.type = 'checkbox'
							inputSvc.name = 'services'
							inputSvc.id = 'svc_' + s.id
							inputSvc.value = s.id
							inputSvc.checked = isReadChecked
							inputSvc.addEventListener('change', function () {
								onServiceToggle(s.id)
							})
							tdRead.appendChild(inputSvc)
							if (hasRw) {
								const isWriteChecked = isReadChecked && serviceIdsWrite.has(s.id)
								const inputWr = document.createElement('input')
								inputWr.type = 'checkbox'
								inputWr.name = 'write'
								inputWr.id = 'wr_' + s.id
								inputWr.value = s.id
								inputWr.checked = isWriteChecked
								inputWr.disabled = !isReadChecked
								inputWr.addEventListener('change', function () {
									updateAllRowState()
								})
								tdWrite.appendChild(inputWr)
							}
						}
						tr.appendChild(tdSvc)
						tr.appendChild(tdRead)
						tr.appendChild(tdWrite)
						tbody.appendChild(tr)
					}
					const allRead = document.getElementById('all-read')
					const allWrite = document.getElementById('all-write')
					if (allRead) {
						allRead.addEventListener('click', function () {
							const checked = allRead.checked
							const services = document.querySelectorAll('input[name="services"]')
							for (const s of services) {
								const id = s.value
								const w = document.getElementById('wr_' + id)
								if (s.type === 'hidden') {
									if (!checked && w) {
										w.checked = false
										s.disabled = true
									}
									continue
								}
								s.checked = checked
								if (w) {
									w.disabled = !s.checked
									if (!s.checked) w.checked = false
								}
							}
							updateAllRowState()
						})
					}
					if (allWrite) {
						allWrite.addEventListener('click', function () {
							const checked = allWrite.checked
							const services = document.querySelectorAll('input[name="services"]')
							for (const s of services) {
								const id = s.value
								const w = document.getElementById('wr_' + id)
								if (s.type === 'hidden') {
									if (w) {
										w.checked = checked
										s.disabled = !checked
									}
								} else if (w && s.checked) {
									w.checked = checked
								}
							}
							updateAllRowState()
						})
					}
					updateAllRowState()
				} else {
					if (tableEl) tableEl.style.display = 'none'
				}
				const hiddenContainer = document.getElementById('hidden-inputs')
				for (const [key, value] of Object.entries(params)) {
					if (key === 'services' || key === 'write' || key === 'app_name' || key === 'name') continue
					const input = document.createElement('input')
					input.type = 'hidden'
					input.name = key
					input.value = value
					hiddenContainer.appendChild(input)
				}
			}

			init()
		</script>
	</body>
</html>
